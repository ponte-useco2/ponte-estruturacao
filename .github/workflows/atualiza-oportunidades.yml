# Sincroniza public/dados/oportunidades.json a partir do repositório que
# processa os dados: diretoriajnconsulting-dotcom/jn-portal-oportunidades.
#
# Divisão de responsabilidade:
#   jn-portal  → baixa 215 MB da origem, processa com DuckDB, publica o contrato
#   este repo  → copia 60 KB e deixa a Vercel servir do CDN
#
# Não duplicamos o processamento. Um lugar só faz o trabalho pesado; aqui só
# consumimos o resultado já validado contra o schema.
#
# Roda depois do pipeline de lá (12:30 UTC), com folga para ele terminar.

name: Sincroniza oportunidades

on:
  schedule:
    - cron: "15 14 * * *" # 14:15 UTC = 11:15 Fortaleza (jn-portal roda 12:30 UTC)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-oportunidades
  cancel-in-progress: false

env:
  FONTE: https://raw.githubusercontent.com/diretoriajnconsulting-dotcom/jn-portal-oportunidades/main/public/data/oportunidades.json

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install jsonschema

      - name: Baixar o contrato publicado
        run: |
          curl -fsSL "$FONTE" -o /tmp/oportunidades.json
          echo "Baixados $(wc -c < /tmp/oportunidades.json) bytes"

      - name: Validar antes de aceitar
        run: |
          python - <<'EOF'
          import json, sys, jsonschema
          schema  = json.load(open("docs/oportunidades.schema.json"))
          payload = json.load(open("/tmp/oportunidades.json"))

          # Major incompatível = o front recusaria renderizar. Falha aqui, antes
          # de publicar, para não trocar um dado bom por um que quebra a página.
          major = str(payload.get("versao", "")).split(".")[0]
          if major != "1":
              print(f"::error::Contrato major {major} incompatível com o front (espera 1.x)")
              sys.exit(1)

          try:
              jsonschema.validate(payload, schema)
          except jsonschema.ValidationError as e:
              print(f"::error::Payload viola o contrato: {e.message}")
              sys.exit(1)

          print(f"OK — {len(payload['oportunidades'])} oportunidades, "
                f"UF={payload['uf']}, defasada={payload['origem']['defasada']}")
          EOF

      - name: Publicar
        run: |
          mkdir -p public/dados
          cp /tmp/oportunidades.json public/dados/oportunidades.json

      - name: Commit se mudou
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/dados/oportunidades.json
          if git diff --staged --quiet; then
            echo "Dado idêntico ao publicado — nada a fazer."
          else
            git commit -m "chore(dados): sincroniza oportunidades $(date -u +%F) [skip ci]"
            git push
          fi
